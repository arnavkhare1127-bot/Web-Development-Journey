<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <table>
        <caption>Employee Details</caption>
        <tr>
            <th>Serial Number</th>
            <th>Name</th>
            <th>Designation</th>
            <th>Gender</th>
        </tr>
        <tr>
            <th>Employee 01</th>
            <td>Sam</td>
            <td>Manager</td>
            <td>Male</td>
        </tr>
        <tr>
            <th>Employee 02</th>
            <td>Joe</td>
            <td>Manager</td>
            <td>Male</td>
        </tr>
        <tr>
            <th>Employee 03</th>
            <td>Mary</td>
            <td>Sr. Manager</td>
            <td>Female</td>
        </tr>
        <tr>
            <th>Employee 04</th>
            <td>Dexter</td>
            <td>Asst. Manager</td>
            <td>Male</td>
        </tr>

        <!-- rowspan and colspan -->

        <tr>
            <th>Employee 05</th>
            <td colspan="02">Kylie</td>
            <!-- <td>Manager</td> -->
            <td>Female</td>
        </tr>
        <tr>
            <th>Employee 06</th>
            <td>Ella</td>
            <td>Admin</td>
            <td rowspan="2">Female</td>
        </tr>
        <tr>
            <th>Employee 07</th>
            <td>Derek</td>
            <td>Admin</td>
            <!-- <td>Female</td> -->
        </tr>

    </table>
</body>

</html>
